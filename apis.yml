aid: acadarena
name: AcadArena
description: >-
  AcadArena is a Philippine campus gaming and esports company founded in 2019 by Ariane Lim, Kevin
  Hoang and Justin Banusin, and trades today as a brand owned by AcadArena Digital Education
  Solutions OPC. It builds student communities around games across high-school and college campuses
  in the Philippines and Southeast Asia, running the AcadArena Alliance student-club accreditation
  network, an Incubator that helps students stand up a club on a campus that has none, the Buffs
  marketplace that supplies loot and sponsorship for campus events, an Alliance for Teachers
  practice community for moderators and educators, and collegiate competitions. The company has
  served hundreds of schools, has been the Philippine collegiate licensee for Riot Games titles, and
  raised a $3.5M seed round. Its public surface is a Next.js marketing site backed by a key-gated
  Supabase project; AcadArena publishes no developer portal, API reference, SDK or machine-readable
  contract, and the api.acadarena.com hostname it once used now resolves only to a dangling CNAME.
